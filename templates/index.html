<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhantomNotes - AI Document Summarizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-ghost"></i>
                <h1>PhantomNotes</h1>
            </div>
            <p class="subtitle">Transform your documents into intelligent summaries</p>
        </header>

        <div class="card">
            <form id="uploadForm" 
                  hx-post="/summarize" 
                  hx-encoding="multipart/form-data"
                  hx-target="#resultContainer"
                  hx-indicator="#spinner">
                
                <!-- Input Method Tabs -->
                <div class="input-tabs">
                    <button type="button" class="tab-btn active" data-tab="pdf">
                        <i class="fas fa-file-pdf"></i>
                        PDF Upload
                    </button>
                    <button type="button" class="tab-btn" data-tab="text">
                        <i class="fas fa-keyboard"></i>
                        Paste Text
                    </button>
                </div>

                <!-- PDF Upload Tab -->
                <div class="tab-content active" id="pdf-tab">
                    <div class="form-group">
                        <label for="file">
                            <i class="fas fa-file-pdf"></i> 
                            Upload PDF Document
                        </label>
                        <div class="file-upload-wrapper">
                            <input 
                                type="file" 
                                id="file" 
                                name="file" 
                                accept=".pdf" 
                                class="file-input">
                            <div class="file-upload-display">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <span id="fileName">Drop your PDF here or click to browse</span>
                                <small>Maximum file size: 50MB</small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Text Input Tab -->
                <div class="tab-content" id="text-tab">
                    <div class="form-group">
                        <label for="textInput">
                            <i class="fas fa-align-left"></i> 
                            Paste Your Text
                        </label>
                        <textarea 
                            id="textInput" 
                            name="text_input" 
                            class="text-input"
                            placeholder="Paste your text here... (articles, documents, notes, etc.)"
                            rows="12"></textarea>
                        <small class="char-counter">
                            <span id="charCount">0</span> characters
                        </small>
                    </div>
                </div>

                <!-- Summary Type Selection -->
                <div class="form-group">
                    <label for="userType">
                        <i class="fas fa-user-tag"></i> 
                        Summary Type
                    </label>
                    <select id="userType" name="user_type" required class="select-input">
                        <option value="student">Student - Study Notes</option>
                        <option value="novel_reader">Novel Reader - Plot & Characters</option>
                        <option value="researcher">Researcher - Methodology & Findings</option>
                        <option value="professional">Business - Action Items & Decisions</option>
                        <option value="legal">Legal - Clauses & Terms</option>
                        <option value="technical">Technical - Architecture & APIs</option>
                        <option value="news">News - 5W1H Summary</option>
                        <option value="meeting">Meeting Notes - Decisions & Actions</option>
                        <option value="quick">Quick Overview</option>
                        <option value="detailed">Detailed Analysis</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-magic"></i>
                    Generate Summary
                </button>

                <div id="spinner" class="spinner-container htmx-indicator">
                    <div class="spinner">
                        <div class="spinner-ring"></div>
                        <i class="fas fa-ghost"></i>
                    </div>
                    <p class="loading-text">Analyzing your document...</p>
                </div>
            </form>
        </div>

        <div id="resultContainer"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
