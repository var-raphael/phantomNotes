<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhantomNotes - AI Document Summarizer</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Theme Toggle Button -->
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-ghost"></i>
                <h1>PhantomNotes</h1>
            </div>
            <p class="subtitle">
                <i class="fas fa-magic"></i> 
                Extract and summarize your documents instantly with AI
            </p>
        </header>

        <!-- Upload Form -->
        <div class="card">
            <form id="uploadForm" 
                  hx-post="/summarize" 
                  hx-encoding="multipart/form-data"
                  hx-target="#resultContainer"
                  hx-indicator="#spinner">
                
                <!-- File Upload -->
                <div class="form-group">
                    <label for="files">
                        <i class="fas fa-cloud-upload-alt"></i> 
                        Upload Documents
                    </label>
                    <div class="file-upload-wrapper">
                        <input 
                            type="file" 
                            id="files" 
                            name="files" 
                            multiple 
                            accept=".pdf,image/*" 
                            required
                            class="file-input">
                        <div class="file-upload-display">
                            <i class="fas fa-file-upload"></i>
                            <span id="fileNames">Choose PDF or Images (Max 5)</span>
                        </div>
                    </div>
                    <small class="help-text">
                        <i class="fas fa-info-circle"></i> 
                        Supported: PDF, JPG, PNG (Max 50MB total)
                    </small>
                </div>

                <!-- User Type Selection -->
                <div class="form-group">
                    <label for="userType">
                        <i class="fas fa-user-tag"></i> 
                        I am a...
                    </label>
                    <select id="userType" name="user_type" required class="select-input">
                        <option value="student">
                            <i class="fas fa-graduation-cap"></i> Student
                        </option>
                        <option value="novel_reader">Novel Reader</option>
                        <option value="researcher">Researcher</option>
                        <option value="professional">Professional/Business</option>
                        <option value="legal">Legal Document Reader</option>
                        <option value="technical">Technical Documentation</option>
                        <option value="news">News Article Reader</option>
                        <option value="meeting">Meeting Notes</option>
                        <option value="quick">Quick Overview</option>
                        <option value="detailed">Detailed Analysis</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-brain"></i>
                    Generate Summary
                </button>

                <!-- Loading Spinner -->
                <div id="spinner" class="spinner-container htmx-indicator">
                    <div class="spinner">
                        <i class="fas fa-ghost fa-3x"></i>
                    </div>
                    <p class="loading-text">
                        <i class="fas fa-sparkles"></i> 
                        Processing your document with AI magic...
                    </p>
                </div>
            </form>
        </div>

        <!-- Results Container -->
        <div id="resultContainer"></div>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
